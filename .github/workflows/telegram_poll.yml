name: 텔레그램 명령 수신 (/make · /daily) 5분 폴링

on:
  schedule:
    # GitHub Actions 스케줄의 최소 간격은 5분입니다. 혼잡 시 더 늦어질 수 있습니다.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-telegram-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: requests 설치
        run: pip install --quiet requests

      - name: 텔레그램 명령 수거 및 렌더링 트리거
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 기본 GITHUB_TOKEN 으로 만든 이벤트는 다른 워크플로를 트리거하지 않습니다.
          # 반드시 별도 PAT(Contents: write)를 QA_DISPATCH_TOKEN Secret 으로 등록하세요.
          QA_DISPATCH_TOKEN: ${{ secrets.QA_DISPATCH_TOKEN }}
        run: python scripts/telegram_poll_dispatch.py
