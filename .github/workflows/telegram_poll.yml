name: Telegram 기존 polling (롤백용 수동 실행)

on:
  # 2026-09-17: webhook 실제 발행·회신·중복 방지 검증 후 schedule 제거.
  # 롤백: 운영 도구에서 deleteWebhook 후 수동 실행. 필요 시 5분 schedule 복원.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-telegram-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: requests 설치
        run: pip install --quiet requests

      - name: 텔레그램 명령 수거 및 렌더링 트리거
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 기본 GITHUB_TOKEN 으로 만든 이벤트는 다른 워크플로를 트리거하지 않습니다.
          # 반드시 별도 PAT(Contents: write)를 QA_DISPATCH_TOKEN Secret 으로 등록하세요.
          QA_DISPATCH_TOKEN: ${{ secrets.QA_DISPATCH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python scripts/telegram_poll_dispatch.py
