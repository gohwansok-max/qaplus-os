name: 큐에이플러스 일일 숏츠 영상 자동 렌더링 & 텔레그램 발송

on:
  schedule:
    # 매일 한국 시간(KST) 오전 06:00 (UTC 21:00) 정기 자동 실행
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: '만들고 싶은 쇼츠 영상 주제 (미입력 시 큐에서 자동 선택)'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [generate_video]

permissions:
  contents: write

jobs:
  generate-daily-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시스템 필수 패키지 설치 (FFmpeg & 한글 나눔폰트)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-nanum-extra
          fc-cache -fv

      - name: 파이썬 라이브러리 설치 (Pillow, Edge-TTS, Requests)
        run: |
          python -m pip install --upgrade pip
          pip install pillow edge-tts requests ddgs

      - name: 큐에이플러스 쇼츠 오토파일럿 실행 & 텔레그램 발송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 저장소에 등록된 CHIPSUB_API를 런타임 환경변수로만 전달합니다.
          CHEAPAI_API_KEY: ${{ secrets.CHIPSUB_API }}
          CHEAPAI_BASE_URL: https://api.cheapai.im/v1
          CHEAPAI_STORY_MODEL: claude-sonnet-5
          CHEAPAI_STORY_FALLBACK_MODEL: gpt-5.6-sol
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            echo "사용자 지정 주제 실행: ${{ github.event.inputs.topic }}"
            python scripts/daily_qa_autopilot.py --topic "${{ github.event.inputs.topic }}"
          elif [ -n "${{ github.event.client_payload.topic }}" ]; then
            echo "웹훅/텔레그램 지정 주제 실행: ${{ github.event.client_payload.topic }}"
            python scripts/daily_qa_autopilot.py --topic "${{ github.event.client_payload.topic }}"
          else
            echo "큐 기반 일일 자동 발행 실행"
            python scripts/daily_qa_autopilot.py
          fi

      - name: 생성된 MP4 영상 아티팩트 업로드 (다운로드용)
        uses: actions/upload-artifact@v4
        with:
          name: daily-shorts-video
          path: |
            outputs/videos/*.mp4
            outputs/metadata/*.json
          retention-days: 30

      - name: 변경사항 Git 커밋 및 푸시 (outputs/videos & 토픽 큐 갱신)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/videos/ outputs/metadata/ knowledge/qa_topics_queue.json outputs/frames/ outputs/audio/ || true
          if git status --porcelain | grep -q .; then
            git commit -m "chore(auto): 일일 큐에이플러스 숏츠 영상 자동 렌더링 완료"
            git push origin HEAD || echo "Git push skipped or failed gracefully"
          else
            echo "커밋할 새로운 파일이 없습니다."
          fi

  notify-failure:
    name: 실패 시 텔레그램 알림
    needs: generate-daily-shorts
    if: ${{ needs.generate-daily-shorts.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: 작업 실패 알림 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="🚨 [QA+] 일일 쇼츠 자동화 실패\n\n실행 ID: ${{ github.run_id }}\n트리거: ${{ github.event_name }}\n로그: ${RUN_URL}\n\n로그에서 실패 단계를 확인한 뒤 다시 실행해 주세요."
          curl --retry 2 --retry-delay 2 --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" || echo "::warning::텔레그램 실패 알림 전송에 실패했습니다."
